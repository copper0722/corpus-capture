name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tests, registry, public safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned by commit, not by tag: a tag can be moved onto other
      # code, and this workflow runs on every contributor's pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Registry schema
        # Two validators describe this file. The tests assert they agree; this
        # step is the one a contributor can run in their editor.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path("profiles/schema.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("profiles/capture_profiles.json").read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.Draft202012Validator(schema).validate(registry)
          print(f"registry validates: {len(registry['profiles'])} profiles")
          PY

      - name: Node is available for the extension parse tests
        # The JavaScript checks skip themselves when node is missing, so a
        # runner without it would report green having tested nothing.
        run: node --version

      - name: Tests
        run: pytest

      - name: Public safety scan
        # Already covered by the suite. Repeated as its own step so a failure is
        # readable in the checks list without opening the log: this repository
        # is public, and the scrub is the thing that must never quietly rot.
        run: pytest tests/test_public_safety.py -q
