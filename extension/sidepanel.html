<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corpus Capture</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<main>
  <p id="page-note" class="hint" hidden></p>
  <p id="profile" class="badge" hidden></p>

  <!-- On the receiver's own reading page: the work it shows, read-only. -->
  <article id="bundle" aria-live="polite" hidden>
    <h1 id="bundle-title" class="title"></h1>
    <div id="bundle-authors" class="line"></div>
    <p id="bundle-source" class="line"></p>
    <p id="bundle-ids" class="line ids"></p>
    <p id="bundle-tags" class="chips"></p>
  </article>

  <form id="review" hidden>
    <div class="doi">
      <label for="doi">DOI</label>
      <input id="doi" name="doi" type="text" inputmode="url" autocomplete="off"
             spellcheck="false" enterkeyhint="done"
             pattern="\s*((https?://)?(dx\.)?doi\.org/|doi:\s*)?10\.\d{4,9}/\S+\s*"
             aria-describedby="doi-hint doi-error">
      <button id="doi-lookup" type="button" class="icon" title="用這個 DOI 重新查詢"
              aria-label="用這個 DOI 重新查詢">↻</button>
      <a id="doi-link" class="icon" target="_blank" rel="noreferrer noopener"
         title="在 doi.org 開啟" aria-label="在 doi.org 開啟" hidden>↗</a>
    </div>
    <p id="doi-hint" class="hint" hidden></p>
    <p id="doi-error" class="error-msg">DOI 格式為 10.xxxx/…；沒有請留空</p>
    <p id="meta-status" class="hint" role="status" aria-live="polite" hidden></p>
    <p id="known" class="note" hidden></p>
    <div id="fields"></div>
    <button id="save" type="submit"
            title="快捷鍵 Alt+Shift+S（Mac：Control+Shift+S）。儲存中請保持側欄開啟。">儲存</button>
  </form>

  <section id="run" aria-label="儲存進度" hidden>
    <p id="status" role="status" aria-live="polite"></p>
    <ol id="rows"></ol>
    <p id="result"></p>
  </section>

  <ul id="receipts" aria-label="最近的擷取"></ul>

  <footer class="bar">
    <span id="version" class="version"></span>
    <a id="options" href="options.html" title="設定" aria-label="設定">⚙</a>
  </footer>
</main>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
